 $('drawer').innerHTML=`<button class="x" style="float:right;font-size:28px" onclick="closeAll()">×</button><h2>${t('cart')}</h2>`+(!c.L.length?`<p>${t('empty')}</p><button class="pri" onclick="closeAll()">${t('cont')}</button>`:
 c.L.map(({p,b})=>`<div class="it"><div><b>${esc(p.name)}</b><br><small>${p.price!=null?fmt(p.price)+' '+t('perBox'):t('soon')}<br>${b} ${b>1?t('boxes'):t('box')} · ${b*p.unit_weight} kg</small></div>
 <div style="text-align:right"><div class="q"><button onclick="cq('${p.grade}',-1)">−</button><b>${b}</b><button onclick="cq('${p.grade}',1)">+</button></div><br><button class="x" onclick="rm('${p.grade}')">✕</button>${p.price!=null?'<br>'+fmt(b*p.price):''}</div></div>`).join('')+
 `<p><b>${t('weight')}: ${c.w} kg</b></p><p class="price">${t('total')}: ${c.pend?t('pending'):fmt(c.a)}</p><button class="pri" onclick="co()">${t('checkout')}</button> <button class="dk" onclick="closeAll()">${t('cont')}</button> <button class="x" onclick="cart={};save();renderCart()">${t('clear')}</button>`)}
function cq(g,d){cart[g]=Math.min(100,(cart[g]||0)+d);if(cart[g]<1)delete cart[g];save();renderCart()}function rm(g){delete cart[g];save();renderCart()}
$('cartBtn').onclick=()=>{$('drawer').classList.add('on');$('ov').classList.add('on')};
function co(){const c=totals();if(c.pend||c.L.some(({p})=>!ok(p))){toast(t('na'));return}
 const f=(id,l,x='')=>`<label>${t(l)}</label><input id="${id}" ${x}>`;
 $('mod').innerHTML=`<button class="x" style="float:right;font-size:28px" onclick="closeAll()">×</button><h2>${t('checkout')}</h2><div id="co">${f('cn','name')}${f('cp','mobile','inputmode="numeric"')}<label>${t('addr')}</label><textarea id="ca" rows="3"></textarea>${f('cc','city')}${f('cd','district')}${f('cz','pin','inputmode="numeric" maxlength="6"')}<label>${t('note')}</label><textarea id="cm" rows="2"></textarea>
 <p><b>${t('weight')}: ${c.w} kg · ${t('total')}: ${fmt(c.a)}</b></p><p><small>${t('after')}</small></p><button class="pri" id="go" onclick="send()">${t('send')}</button></div>`;
 $('mod').classList.add('on');$('drawer').classList.remove('on')}
async function send(){const v=id=>$(id).value.trim(),ph=v('cp').replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'');
 const chk={cn:v('cn').length>1,cp:/^[6-9]\d{9}$/.test(ph),ca:v('ca').length>4,cc:!!v('cc'),cd:!!v('cd'),cz:/^\d{6}$/.test(v('cz'))};let bad=0;
 for(const k in chk){$(k).classList.toggle('bad',!chk[k]);if(!chk[k])bad=1}if(bad){toast(t('fill'));return}
 $('go').disabled=true;const c=totals();let w=c.w,a=c.a;
 try{const{data,error}=await sb.rpc('place_order',{p_name:v('cn'),p_phone:ph,p_address:v('ca'),p_city:v('cc'),p_district:v('cd'),p_pin:v('cz'),p_note:v('cm'),p_items:c.L.map(({p,b})=>({grade:p.grade,boxes:b}))});
  if(error)throw error;w=data.total_weight;a=data.total_amount}catch(e){console.warn(e);toast(t('na'));$('go').disabled=false;await load();return}
 const m=`Hello Madhav Mango Farm!\n\nI would like to place an order.\n\nProducts:\n${c.L.map(({p,b})=>`${p.name} – ${b} ${b>1?'boxes':'box'} (${b*p.unit_weight} kg)`).join('\n')}\n\nTotal weight: ${w} kg\nTotal amount: ₹${a}\n\nCustomer name: ${v('cn')}\nMobile: ${ph}\nDelivery address: ${v('ca')}\nCity: ${v('cc')}\nDistrict: ${v('cd')}\nPIN code: ${v('cz')}\n${v('cm')?'Note: '+v('cm')+'\n':''}\nPlease confirm my order and delivery details.`;
 const url=wa(S.primary_whatsapp,m);cart={};save();renderCart();window.open(url,'_blank');
 $('co').innerHTML=`<p><b>${t('after')}</b></p><p>${t('fallback')}</p><textarea id="fm" rows="9" readonly>${esc(m)}</textarea><button class="dk" onclick="fm.select();navigator.clipboard?.writeText(fm.value);toast(t('copied'))">${t('copy')}</button> <a class="btn pri" target="_blank" rel="noopener" href="${url}">WhatsApp</a>`}
async function load(){try{const[a,b]=await Promise.all([sb.from('products').select('*,images:product_images(image_url,display_order)').eq('active',true).order('grade'),sb.from('site_settings').select('*').eq('id',1).single()]);
 if(a.error||b.error)throw 0;P=a.data.map(p=>({...p,images:(p.images||[]).sort((x,y)=>x.display_order-y.display_order)}));S=b.data;
 $('wa1').href=wa(S.primary_whatsapp,'Hello Rupeshbhai!');$('wa2').href=wa(S.secondary_whatsapp,'Hello Yash!');$('waHero').href=wa(S.primary_whatsapp,'Hello Madhav Mango Farm! I would like to order Kesar mangoes.');
 if(S.hero_image_url)$('hero').style.setProperty('--hero',`url("${S.hero_image_url.replace(/"/g,'%22')}")`);applyLang()}catch{$('grid').innerHTML=`<p>${t('err')}</p>`}}
$('lang').onchange=e=>{lang=e.target.value;localStorage.lang=lang;applyLang()};$('yr').textContent=new Date().getFullYear();document.querySelectorAll('nav .lk').forEach(a=>a.onclick=()=>nav.classList.remove('open'));applyLang();load();
</script></body></html>
