<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin · Madhav Mango Farm</title><style>
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#FFF9EB;color:#202820}header{background:#153D2B;color:#F5B92E;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
main{max-width:1000px;margin:auto;padding:20px}.c{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 16px #0001}
input,textarea,select{width:100%;padding:9px;border:1.5px solid #ddd;border-radius:8px;font:inherit;margin:3px 0 10px}label{font-size:12px;font-weight:600}
button{border:0;border-radius:99px;padding:10px 20px;font-weight:600;cursor:pointer;background:#153D2B;color:#fff}button.y{background:#F5B92E;color:#153D2B}button.r{background:#fff;color:#a33;border:1px solid #a33;padding:4px 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.st div{background:#fff;border-radius:12px;padding:14px;text-align:center}.st b{font-size:26px;display:block}
.im{display:flex;flex-wrap:wrap;gap:10px}.im div{text-align:center}.im img{width:110px;height:90px;object-fit:cover;border-radius:10px;display:block}#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#153D2B;color:#fff;padding:10px 20px;border-radius:99px;display:none}
@media(max-width:700px){.g,.st{grid-template-columns:1fr 1fr}}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
</style></head><body><header>Madhav Mango Farm · Admin<button class="y" id="out" style="display:none">Logout</button></header><main id="app"></main><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(CFG.URL,CFG.KEY);const say=m=>{const e=$('msg');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data}=await sb.from('owners').select('user_id').eq('user_id',session.user.id);if(!data?.length){await sb.auth.signOut();say('This account is not authorised.');return login()}dash()}
function login(){$('out').style.display='none';$('app').innerHTML=`<div class="c" style="max-width:380px;margin:60px auto"><h2>Owner login</h2><label>Email</label><input id="e" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button onclick="doLogin()">Login</button></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$('e').value,password:$('p').value});if(error)return say('Login failed');init()}
$('out').onclick=async()=>{await sb.auth.signOut();login()};
async function resize(f){const b=await createImageBitmap(f),s=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function dash(){$('out').style.display='';const[p,i,s,o]=await Promise.all([sb.from('products').select('*').order('grade'),sb.from('product_images').select('*').order('display_order'),sb.from('site_settings').select('*').eq('id',1).single(),sb.from('orders').select('*').order('created_at',{ascending:false}).limit(10)]);
 const P=p.data||[],I=i.data||[],S=s.data||{},O=o.data||[];
 $('app').innerHTML=`<div class="st"><div><b>${P.length}</b>Products</div><div><b>${P.filter(x=>x.active).length}</b>Active</div><div><b>${P.filter(x=>!x.available).length}</b>Out of stock</div><div><b>${P.map(x=>x.grade+': '+(x.price==null?'—':'₹'+x.price)).join('<br>')}</b>Prices</div></div><br>`+
 P.map(x=>`<div class="c" id="p${x.grade}"><h3>${esc(x.grade)}</h3><div class="g"><div><label>Name</label><input id="n${x.grade}" value="${esc(x.name)}"></div><div><label>Price per 10 kg box (₹, blank = "Price coming soon")</label><input id="pr${x.grade}" type="number" min="0" step="1" value="${x.price??''}"></div>
 <div><label>Description (English)</label><textarea id="de${x.grade}" rows="3">${esc(x.description_en)}</textarea></div><div><label>Description (ગુજરાતી)</label><textarea id="dg${x.grade}" rows="3">${esc(x.description_gu)}</textarea></div>
 <div><label>Availability</label><select id="av${x.grade}"><option value="1" ${x.available?'selected':''}>Available</option><option value="0" ${x.available?'':'selected'}>Sold Out</option></select></div>
 <div><label>Status</label><select id="ac${x.grade}"><option value="1" ${x.active?'selected':''}>Active (visible)</option><option value="0" ${x.active?'':'selected'}>Hidden</option></select></div></div>
 <label>Stock note (shown to customers)</label><input id="sn${x.grade}" value="${esc(x.stock_note)}"><label>Photos (mango fruit photos only)</label>
 <div class="im">${I.filter(m=>m.product_id===x.id).map(m=>`<div><img src="${esc(m.image_url)}" alt=""><button class="r" onclick="delImg('${m.id}','${esc(m.image_url)}')">Delete</button></div>`).join('')}</div>
 <input type="file" id="f${x.grade}" accept="image/*" multiple onchange="prev('${x.grade}')"><div class="im" id="pv${x.grade}"></div><button class="y" onclick="saveP('${x.id}','${x.grade}',${I.filter(m=>m.product_id===x.id).length})">Save ${x.grade}</button></div>`).join('')+
 `<div class="c"><h3>Website settings</h3>${[['announcement','Announcement bar'],['tagline','Hero headline'],['primary_whatsapp','Primary WhatsApp (e.g. 919712306108)'],['secondary_whatsapp','Secondary WhatsApp'],['hero_image_url','Hero image URL (upload a mango photo to Storage, paste its URL)']].map(([k,l])=>`<label>${l}</label><input id="s_${k}" value="${esc(S[k])}">`).join('')}
 ${[['about_en','About (English)'],['about_gu','About (ગુજરાતી)'],['delivery_en','Delivery (English)'],['delivery_gu','Delivery (ગુજરાતી)']].map(([k,l])=>`<label>${l}</label><textarea id="s_${k}" rows="3">${esc(S[k])}</textarea>`).join('')}<button class="y" onclick="saveS()">Save settings</button></div>
 <div class="c"><h3>Recent orders</h3>${O.length?`<table><tr><th>Date</th><th>Customer</th><th>Kg</th><th>₹</th><th>Status</th></tr>${O.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.customer_name)} ${esc(r.phone)}</td><td>${r.total_weight}</td><td>${r.total_amount}</td><td>${esc(r.status)}</td></tr>`).join('')}</table>`:'No orders yet.'}</div>`}
function prev(g){$('pv'+g).innerHTML=[...$('f'+g).files].map(f=>`<img src="${URL.createObjectURL(f)}" style="width:110px;height:90px;object-fit:cover;border-radius:10px" alt="">`).join('')}
async function saveP(id,g,count){const pr=$('pr'+g).value,price=pr===''?null:Number(pr);if(price!==null&&(isNaN(price)||price<0))return say('Invalid price');
 const{error}=await sb.from('products').update({name:$('n'+g).value,price,description_en:$('de'+g).value,description_gu:$('dg'+g).value,available:$('av'+g).value==='1',active:$('ac'+g).value==='1',stock_note:$('sn'+g).value,updated_at:new Date().toISOString()}).eq('id',id);if(error)return say('Save failed: '+error.message);
 const files=[...$('f'+g).files];let k=count;for(const f of files){const b=await resize(f),path=`${g}/${Date.now()}-${k}.jpg`;const u=await sb.storage.from('product-images').upload(path,b,{contentType:'image/jpeg'});if(u.error)return say('Upload failed: '+u.error.message);
  const url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;await sb.from('product_images').insert({product_id:id,image_url:url,display_order:k++})}say('Saved');dash()}
async function delImg(id,url){if(!confirm('Delete this photo?'))return;const path=url.split('/product-images/')[1];if(path)await sb.storage.from('product-images').remove([path]);await sb.from('product_images').delete().eq('id',id);dash()}
async function saveS(){const d={};document.querySelectorAll('[id^=s_]').forEach(e=>d[e.id.slice(2)]=e.value);const{error}=await sb.from('site_settings').update(d).eq('id',1);say(error?'Failed: '+error.message:'Settings saved')}
init();</script></body></html>
